<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omkar — Moving Exhibition Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f2;color:#14271f}header{padding:70px 6vw 50px}header p{max-width:540px;line-height:1.7;font-size:17px}header span{font-size:12px;letter-spacing:.2em}h1{font-size:clamp(32px,5vw,70px);letter-spacing:-.05em;margin:20px 0}.exhibition{height:330vh;position:relative}.stage{height:100svh;position:sticky;top:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.heading{display:flex;align-items:end;justify-content:space-between;margin:0 6vw 26px;gap:20px}h2{font-size:clamp(28px,5vw,70px);margin:0;letter-spacing:-.04em;text-transform:uppercase}.counter{font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}.track{display:flex;gap:4vw;padding:0 6vw;width:max-content;will-change:transform}figure{margin:0;width:72vw;height:64svh;position:relative;overflow:hidden;background:#ddd}figure img{display:block;width:100%;height:100%;object-fit:contain;background:#e9e9e2}figcaption{position:absolute;bottom:20px;left:20px;background:rgba(0,0,0,.68);color:white;padding:10px 15px;font-size:12px;letter-spacing:.14em}.progress{height:2px;background:#cbd2cc;margin:26px 6vw 0}.progress i{display:block;height:100%;background:currentColor;transform:scaleX(0);transform-origin:left}.hint{margin:14px 6vw 0;font-size:11px;letter-spacing:.2em}.dark{background:#000;color:#fff;height:220vh}.dark figure img{background:#111}.dark .progress{background:#333}footer{padding:60px 6vw;text-align:center}button{padding:14px 25px;background:none;border:1px solid currentColor;font:inherit;cursor:pointer}@media(max-width:700px){figure{width:86vw;height:58svh}.heading{align-items:center}header{padding-top:45px}.exhibition{height:280vh}.dark{height:180vh}}@media(prefers-reduced-motion:reduce){.exhibition,.dark{height:auto}.stage{height:auto;position:relative;padding:40px 0}.track{width:auto;display:grid;padding:0 6vw;transform:none!important}figure{width:100%;height:auto}figure img{height:auto}.progress,.hint{display:none}}

figure{transform-origin:50% 80%;will-change:transform,opacity}
.heading{will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){figure,.heading{transform:none!important;opacity:1!important}}
</style>
</head>
<body>
<header><span>OMKAR / GALLERY CONCEPT 02</span><h1>A moving exhibition.</h1><p>Scroll down. Photographs arrive from the lower right, straighten and settle into place, then glide sideways as you continue.</p></header>
<section class="exhibition"><div class="stage"><div class="heading"><h2>Arch Gate</h2><div class="counter">01 / 04</div></div><div class="track">
<figure><img src="/assets/arch-gate/blackberrys.jpg" alt="Blackberrys entrance gate"><figcaption>01 — BLACKBERRYS</figcaption></figure>
<figure><img src="/assets/arch-gate/giva.jpg" alt="GIVA Diwali arch"><figcaption>02 — GIVA</figcaption></figure>
<figure><img src="/assets/arch-gate/festival-of-diamonds.jpg" alt="Festival of Diamonds arch"><figcaption>03 — FESTIVAL OF DIAMONDS</figcaption></figure>
<figure><img src="/assets/arch-gate/mia.jpg" alt="Mia entrance gate"><figcaption>04 — MIA</figcaption></figure>
</div><div class="progress"><i></i></div><div class="hint">SCROLL TO EXPLORE →</div></div></section>
<section class="exhibition dark"><div class="stage"><div class="heading"><h2>Trade Show</h2><div class="counter">01 / 02</div></div><div class="track">
<figure><img src="/assets/trade-show/luxe.jpg" alt="Luxe trade show display"><figcaption>01 — LUXE</figcaption></figure>
<figure><img src="/assets/trade-show/lee.jpg" alt="Lee trade show display"><figcaption>02 — LEE</figcaption></figure>
</div><div class="progress"><i></i></div><div class="hint">SCROLL TO EXPLORE →</div></div></section>
<footer><button onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to start ↑</button></footer>
<script>
const galleries=[...document.querySelectorAll('.exhibition')].map(section=>({section,track:section.querySelector('.track'),bar:section.querySelector('i'),counter:section.querySelector('.counter'),count:section.querySelectorAll('figure').length}));
let queued=false;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const clamp=value=>Math.max(0,Math.min(1,value));
function draw(){
  queued=false;
  galleries.forEach(({section,track,bar,counter,count})=>{
    if(reducedMotion.matches)return;
    const top=section.getBoundingClientRect().top;
    const available=section.offsetHeight-innerHeight;
    const p=clamp(-top/Math.max(1,available));
    const travel=clamp((p-.08)/.92);
    const distance=Math.max(0,track.scrollWidth-innerWidth);
    track.style.transform=`translate3d(${-travel*distance}px,0,0)`;
    bar.style.transform=`scaleX(${travel})`;
    counter.textContent=`${String(1+Math.round(travel*(count-1))).padStart(2,'0')} / ${String(count).padStart(2,'0')}`;
    const arrival=clamp((innerHeight*.9-top)/(innerHeight*.9));
    const heading=section.querySelector('.heading');
    const titleEase=1-Math.pow(1-clamp(arrival*1.5),3);
    heading.style.opacity=titleEase;
    heading.style.transform=`translate3d(${-45*(1-titleEase)}px,0,0)`;
    track.querySelectorAll('figure').forEach((figure,index)=>{
      const stagger=Math.min(index,2)*.1;
      const entry=clamp((arrival-stagger)/(1-stagger));
      const ease=1-Math.pow(1-entry,3);
      figure.style.opacity=ease;
      figure.style.transform=`translate3d(${180*(1-ease)}px,${110*(1-ease)}px,0) rotate(${6*(1-ease)}deg) scale(${.9+.1*ease})`;
    });
  });
}
function schedule(){if(!queued){queued=true;requestAnimationFrame(draw)}}addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule);draw();
</script>
</body></html>
